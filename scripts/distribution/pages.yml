name: Deploy Fly landing and packages
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site and verified RPM bodies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/fly-packages-build.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages looks the artifact up within a second of the upload, and
      # GitHub's run artifact listing can lag behind it: since 2026-11-23 it
      # failed with 'No artifacts named "github-pages"' while the upload had
      # succeeded. Deploy only once the listing shows the artifact.
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq '.artifacts[].name' | grep -qx github-pages; then
              exit 0
            fi
            sleep 5
          done
          echo 'The github-pages artifact was never listed for this run.' >&2
          exit 1
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
