name: PR guardrails

# Separate from verification on purpose: this has to re-run when a label
# changes, and `labeled`/`unlabeled` on verify.yml would rerun the whole test
# suite every time someone touched a label.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# One run at a time per pull request, in the order the events arrived, so the
# run that finishes last is the one GitHub keeps as the answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # The version a release gets is derived from these labels, so a pull request
  # without one would silently ship as a patch.
  impact_label:
    name: impact_label
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one impact label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        # Ask for the labels the pull request has now, not the ones in the
        # event. `gh pr create --label` opens the pull request and only then
        # labels it, so the `opened` event carries no labels, and its run can
        # finish after the `labeled` one. A re-run replays that same event.
        run: |
          set -euo pipefail
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.labels[].name]')
          mapfile -t impact < <(jq -r '.[] | select(startswith("impact:"))' <<<"$LABELS")

          if [ "${#impact[@]}" -eq 1 ]; then
            echo "::notice::${impact[0]}"
            exit 0
          fi

          if [ "${#impact[@]}" -eq 0 ]; then
            echo "::error::This pull request has no impact label."
          else
            echo "::error::Conflicting impact labels: ${impact[*]}"
          fi

          cat <<'TEXT'
          Add exactly one, describing what merging this does to someone who
          upgrades:

            impact:major   they have to do something by hand to upgrade
            impact:minor   new capability, upgrading still needs nothing else
            impact:patch   a fix
            impact:none    nothing a user could observe (docs, CI, tests)

            gh pr edit <number> --add-label impact:minor
          TEXT
          exit 1
