name: PR guardrails

# Metadata only: title/label changes must not rerun the verification suite.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# One run at a time per pull request, in the order the events arrived, so the
# run that finishes last is the one GitHub keeps as the answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # The version a release gets is derived from these labels, so a pull request
  # without one would silently ship as a patch.
  impact_label:
    name: impact_label
    runs-on: ubuntu-latest
    steps:
      - name: Require conventional commits/title and exactly one impact label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        # Ask for the metadata the pull request has now, not the values in the
        # event. `gh pr create --label` opens the pull request and only then
        # labels it, so the `opened` event carries no labels, and its run can
        # finish after the `labeled` one. A re-run replays that same event.
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/pulls/' + os.environ['PR']
          pull = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          pages = json.loads(subprocess.check_output(
              ['gh', 'api', '--paginate', '--slurp', endpoint + '/commits'], text=True))
          commits = [commit for page in pages for commit in page]
          conventional = re.compile(
              r'(?:feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)'
              r'(?:\([^()\s:]+\))?!?: \S[^\r\n]*')
          errors = []
          if not conventional.fullmatch(pull['title']):
              errors.append('PR title must use type(scope): description: ' + repr(pull['title']))
          if not commits:
              errors.append('No PR commits were returned; cannot verify their subjects.')
          if len(commits) != pull['commits']:
              errors.append('Incomplete PR commit list; cannot verify every subject: '
                            + str(len(commits)) + ' of ' + str(pull['commits']))
          for commit in commits:
              lines = commit['commit']['message'].splitlines()
              subject = lines[0] if lines else ''
              if not conventional.fullmatch(subject):
                  errors.append('Commit ' + commit['sha'][:12] +
                                ' must use type(scope): description: ' + repr(subject))
          impact = [label['name'] for label in pull['labels']
                    if label['name'].startswith('impact:')]
          if len(impact) != 1 or impact[0] not in {
                  'impact:major', 'impact:minor', 'impact:patch', 'impact:none'}:
              errors.append('Add exactly one of impact:major, impact:minor, impact:patch, '
                            'impact:none; current labels: ' + repr(impact))
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print(f'Conventional title and {len(commits)} commits verified; {impact[0]}.')
          PY
