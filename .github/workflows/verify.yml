name: Verify changes

# Deliberately light: only what means the app is actually broken. A pull
# request opened by hand should go green with nothing more than its impact
# label. Whitespace and the documentation build stay local checks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression tests and generated-file checks
        run: npm test
      - name: Validate application syntax
        run: |
          for file in main.js renderer.js preload.js webview-preload.js keyboard.js keybinds.js; do
            node --check "$file"
          done
