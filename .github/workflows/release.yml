name: Release

# One tag, one release. `vX.Y.Z` builds the Linux, macOS and Windows packages
# and publishes them as a single GitHub Release with checksums.
#
# `workflow_dispatch` is how release-tag.yml starts it: that workflow tags the
# merged version bump with `GITHUB_TOKEN`, whose pushes start nothing. A
# dispatch on a branch is a dry run: it builds every package and keeps them as
# workflow artefacts, but publishes nothing. Use it to test packaging changes
# before they reach a release: `gh workflow run release.yml --ref <branch>`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Three platform builds are not worth spending on a tag that contradicts the
  # tree it points at.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches the declared version
        run: |
          declared="$(node scripts/version-sync.js --print)"
          node scripts/version-sync.js --check
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::notice::Dry run on $GITHUB_REF_NAME: packages are built and kept as artefacts, nothing is published."
          elif [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME was pushed, but the tree declares v$declared."
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            command: npx electron-builder --linux AppImage tar.gz --x64
          - os: macos-latest
            platform: macos
            command: npx electron-builder --mac dmg zip --arm64 --x64
          - os: windows-latest
            platform: windows
            command: npx electron-builder --win nsis portable --x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package application
        run: ${{ matrix.command }} --publish never

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          # latest-linux.yml tells an AppImage where its update is and its SHA-512.
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: packages-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # `-rc.` in the tag is the only thing that marks a pre-release, so the
      # channel is visible in the number itself. The in-app update check reads
      # `releases/latest`, which never returns a pre-release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fly ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body: |
            ## Install

            Download the package for your platform below and check it against
            `SHA256SUMS.txt`. Packages are unsigned: macOS and Windows will warn
            about an unidentified developer.

            On Arch Linux, install `fly-browser-bin` from the AUR instead
            (`paru -S fly-browser-bin`); it updates with the rest of the system.

            Running from source and per-platform notes:
            [Installation](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/guide/installation.md).

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Arch users install the release from the AUR. Release candidates stay on
  # GitHub: pkgver cannot express them.
  aur:
    name: Publish to the AUR
    needs: publish
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-rc.')
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
