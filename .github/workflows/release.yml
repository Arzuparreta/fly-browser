name: Release

# One tag, one native Chromium release. `vX.Y.Z` builds Linux x64 packages
# and publishes them as a single GitHub Release with checksums.
#
# `workflow_dispatch` is how release-tag.yml starts it: that workflow tags the
# merged version bump with `GITHUB_TOKEN`, whose pushes start nothing. A
# dispatch on a branch is a dry run: it builds every package and keeps them as
# workflow artefacts, but publishes nothing. Use it to test packaging changes
# before they reach a release: `gh workflow run release.yml --ref <branch>`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A native engine build must not run on a tag that contradicts the
  # tree it points at.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches the declared version
        run: |
          declared="$(node scripts/version-sync.js --print)"
          node scripts/version-sync.js --check
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::notice::Dry run on $GITHUB_REF_NAME: packages are built and kept as artefacts, nothing is published."
          elif [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME was pushed, but the tree declares v$declared."
            exit 1
          fi

  build:
    name: Build native Chromium (Linux x64)
    needs: verify
    # Chromium exceeds hosted-runner disk/RAM limits. Provision a dedicated
    # trusted host as documented in docs/releasing.md; never use PR triggers.
    runs-on: [self-hosted, linux, x64, fly-chromium]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require provisioned engine checkout
        run: test -n "$FLY_ENGINE_ROOT" && test -d "$FLY_ENGINE_ROOT/src"
      - name: Apply this release overlay
        run: python3 scripts/chromium/native.py refresh-overlay --include-upstream --root "$FLY_ENGINE_ROOT"
      - name: Build and package native Fly
        env:
          FLY_GOOGLE_API_KEY: ${{ secrets.FLY_GOOGLE_API_KEY }}
        run: python3 scripts/chromium/release.py --require-google-api-key --root "$FLY_ENGINE_ROOT" --dist "$RUNNER_TEMP/fly-release-${{ github.run_id }}"
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: ${{ runner.temp }}/fly-release-${{ github.run_id }}/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: packages-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # `-rc.` in the tag is the only thing that marks a pre-release, so the
      # channel is visible in the number itself. The in-app update check reads
      # `releases/latest`, which never returns a pre-release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fly ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body: |
            ## Install

            Download the native Chromium Linux x64 tarball below and verify it
            against `SHA256SUMS.txt`. Extract it and run `./install.sh`, or use
            `fly-install install`.

            On Arch Linux, download `PKGBUILD` below into an empty directory
            and run `makepkg -si` there: it installs `fly-browser-bin`, with
            Fly in your launcher.

            Running from source and per-platform notes:
            [Installation](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/guide/installation.md).

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Arch package: its PKGBUILD is attached to the release and pushed to
  # the AUR. Release candidates stay on GitHub: pkgver cannot express them.
  aur:
    name: Publish to the AUR
    needs: publish
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-rc.')
    permissions:
      contents: write
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
