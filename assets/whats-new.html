<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's New in Fly</title>
    <link rel="icon" type="image/png" href="icons/fly-logo48.png">
    <link rel="stylesheet" href="fonts/fonts.css">
    <style>
        :root {
            --bg-main: #121211;
            --bg-card: #1b1a18;
            --text-main: #e7e1d3;
            --text-muted: #8a857a;
            --accent: #e0261c;
            --accent-dim: rgba(122, 162, 247, 0.12);
            --border: #2b2a27;
            --border-hover: #8a857a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'IBM Plex Sans', sans-serif;
            line-height: 1.6;
            padding: 40px 20px 80px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 760px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tag-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background-color: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .version-date {
            font-size: 12px;
            color: var(--text-muted);
        }

        .github-link {
            margin-left: auto;
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.15s ease;
        }

        .github-link:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .github-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--accent-dim);
            border: 1px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 6px;
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }

        .github-button:hover {
            background-color: var(--accent);
            color: #ffffff;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .feature-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.15s ease;
        }

        .feature-card:hover {
            border-color: var(--border-hover);
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .feature-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .feature-points {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 4px;
        }

        .feature-points li {
            font-size: 13px;
            color: var(--text-muted);
            position: relative;
            padding-left: 16px;
        }

        .releases {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .release-heading {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-badge {
            align-self: flex-start;
            border: 1px solid var(--accent);
            border-radius: 4px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 1px 8px;
            text-transform: uppercase;
        }

        .feature-points li::before {
            content: "•";
            color: var(--accent);
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        footer {
            margin-top: 10px;
            padding: 20px 24px;
            background-color: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer-shortcuts[hidden] {
            display: none;
        }

        .footer-shortcuts {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .close-button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            padding: 5px 12px;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .close-button:hover,
        .close-button:focus-visible {
            border-color: var(--accent);
            color: var(--accent);
            outline: none;
        }

        kbd {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 11px;
            color: var(--accent);
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="tag-row">
                <span class="badge">Release Notes</span>
                <span class="version-date" id="ReleaseDate"></span>
                <a href="https://github.com/Arzuparreta/fly-browser/releases" target="_blank" rel="noopener noreferrer" class="github-link">
                    Full Release on GitHub ↗
                </a>
                <button type="button" class="close-button" data-close title="Close What's New (Escape)">Close <span aria-hidden="true">✕</span></button>
            </div>
            <h1>What's New in Fly</h1>
            <p class="subtitle" id="ReleaseSummary"></p>
        </header>

        <main id="Releases" class="releases"></main>

        <footer>
            <div class="footer-left">
                <a href="https://github.com/Arzuparreta/fly-browser/releases" target="_blank" rel="noopener noreferrer" class="github-button">
                    View Full Release on GitHub ↗
                </a>
                <button type="button" class="close-button" data-close title="Close What's New (Escape)">Close <span aria-hidden="true">✕</span></button>
            </div>
            <div class="footer-shortcuts" id="Shortcuts" hidden></div>
        </footer>
    </div>
    <script src="whats-new-releases.js"></script>
    <script src="whats-new-page.js"></script>
</body>
</html>
