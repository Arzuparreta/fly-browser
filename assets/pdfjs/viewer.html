<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly PDF Viewer</title>
    <link rel="stylesheet" href="pdf_viewer.min.css">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="viewer.css">
    <script src="pdf.min.js"></script>
</head>
<body>
    <header id="viewer-toolbar" class="viewer-toolbar">
        <div class="toolbar-left">
            <span class="toolbar-brand">PDF</span>
            <span id="doc-title" class="doc-title" title="Document Title">Loading document...</span>
        </div>
        
        <div class="toolbar-centre">
            <button id="btn-prev" class="toolbar-btn" title="Previous Page ([)">‹</button>
            <span class="page-indicator">
                <input id="input-page" type="number" min="1" value="1" title="Current Page (Press Enter to jump)">
                <span class="page-separator">/</span>
                <span id="page-total">1</span>
            </span>
            <button id="btn-next" class="toolbar-btn" title="Next Page (])">›</button>
        </div>

        <div class="toolbar-right">
            <button id="btn-zoom-out" class="toolbar-btn" title="Zoom Out (-)">−</button>
            <button id="btn-zoom-fit" class="toolbar-btn text-btn" title="Fit to Width (0)">Fit</button>
            <button id="btn-zoom-in" class="toolbar-btn" title="Zoom In (+)">+</button>
            <div class="toolbar-divider"></div>
            <button id="btn-dark-toggle" class="toolbar-btn" title="Toggle Document Dark Mode (d)">☾</button>
            <button id="btn-save" class="toolbar-btn action-btn" title="Save PDF to Disk (Ctrl+Shift+S)">⤓ Save</button>
        </div>
    </header>

    <main id="viewer-main" class="viewer-main">
        <div id="loading-overlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <div id="loading-message" class="loading-message">Initialising PDF Document...</div>
        </div>
        <div id="error-overlay" class="error-overlay" style="display: none;">
            <div class="error-icon">⚠</div>
            <div id="error-message" class="error-message">Failed to load PDF document.</div>
        </div>
        <div id="pages-container" class="pages-container"></div>
    </main>

    <script src="viewer.js"></script>
</body>
</html>
